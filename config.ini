[Dataset]

dir_home_path = /home/pragnesh/

dataset_dir = /home/pragnesh/Dataset/

selected_dataset_dir = IntelIC

train_folder = train

test_folder = test


[Model]

loadModel = False

is_transfer_learning = True

program_name = vgg_net_channel_pruning

selectedModel = vgg16_IntelIc_Prune

num_classes = 6


[Pruning]

; Fraction of channels targeted for removal across the network by the final
; pruning round (spread across rounds/blocks, deeper blocks pruned more).
max_pruning_ratio = 0.1

; Number of prune -> fine-tune rounds to run.
prune_epochs = 6

; Number of fine-tuning epochs to run after each pruning round.
fine_tune_epochs = 8

batch_size = 16

image_size = 224

max_lr = 0.001

weight_decay = 0.01

l1_lambda = 0.01

grad_clip = 0.1

; Distance metric used by K-means similarity-based channel pruning: manhattan, euclidean, or cosine
distance_metric = manhattan
